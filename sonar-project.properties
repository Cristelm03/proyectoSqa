sonar.projectKey=Cristelm03_proyectoSqa
sonar.organization=cristelm03
sonar.projectName=proyectoSqa

# Codigo de la aplicacion: backend (Express + Prisma) y frontend (React + Vite)
sonar.sources=backend-express,frontend-react/src
sonar.exclusions=**/node_modules/**,**/dist/**,backend-express/coverage/**,backend-express/tests/**,backend-express/jest.config.js,backend-express/eslint.config.js,backend-express/prisma/migrations/**,backend-express/**/*.sql,backend-express/**/*.postman_collection.json

# Pruebas: Sonar las analiza como tests, no como codigo de produccion
sonar.tests=backend-express/tests,frontend-react/tests
sonar.test.inclusions=backend-express/tests/**/*.test.js,frontend-react/tests/**/*.test.jsx

# Cobertura generada por Jest (backend) y Vitest (frontend). El CI antepone el nombre
# de cada paquete a las rutas de los lcov.
sonar.javascript.lcov.reportPaths=backend-express/coverage/lcov.info,frontend-react/coverage/lcov.info
# Sin logica propia que probar; los mismos archivos que excluyen jest.config.js y
# vitest.config.js: index.js arranca el servidor, prisma/client crea el cliente de Prisma
# y main.jsx solo monta React en el DOM.
sonar.coverage.exclusions=backend-express/index.js,backend-express/prisma/client/index.js,frontend-react/src/main.jsx

sonar.sourceEncoding=UTF-8
